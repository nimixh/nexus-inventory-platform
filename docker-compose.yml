name: nexus-inventory

services:
    app:
        build: .
        ports:
            - "8000:8000"
        env_file:
            - path: .env
              required: false
        environment:
            DATABASE_URL: postgresql+psycopg://nexus:nexus@postgres:5432/nexus
            RUNTIME_DATABASE_URL: postgresql+psycopg://nexus_runtime:nexus_runtime@postgres:5432/nexus
            REDIS_URL: redis://redis:6379/0
            JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to at least 32 random characters}
        volumes:
            - uploads_data:/app/uploads
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: nexus
            POSTGRES_PASSWORD: nexus
            POSTGRES_DB: nexus
        ports:
            - "127.0.0.1:5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./docker/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U nexus"]
            interval: 5s
            timeout: 3s
            retries: 5

    redis:
        image: redis:7-alpine
        ports:
            - "127.0.0.1:6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

    worker:
        build: .
        command: celery -A app.celery_app worker -Q sync --loglevel=info --concurrency=2
        env_file:
            - path: .env
              required: false
        environment:
            DATABASE_URL: postgresql+psycopg://nexus:nexus@postgres:5432/nexus
            RUNTIME_DATABASE_URL: postgresql+psycopg://nexus_runtime:nexus_runtime@postgres:5432/nexus
            REDIS_URL: redis://redis:6379/0
            JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY to at least 32 random characters}
        volumes:
            - uploads_data:/app/uploads
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

volumes:
    postgres_data:
    redis_data:
    uploads_data:
