[project]
name = "nexus-inventory"
version = "0.1.0"
description = "Tenant-aware inventory synchronization platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy[postgresql-psycopg]",
    "psycopg[binary]",
    "alembic",
    "pydantic-settings",
    "redis[hiredis]",
    "pyjwt[crypto]",
    "pwdlib[argon2]",
    "pydantic[email]>=2.12.5",
    "pandas>=2.4",
    "openpyxl>=3.1",
    "celery>=5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "FAST",   # FastAPI rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -q"

[dependency-groups]
dev = [
    "ruff>=0.15.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "mypy>=1.20.0",
    "pandas-stubs>=2.3",
    "types-openpyxl>=3.1",
]

[tool.mypy]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
