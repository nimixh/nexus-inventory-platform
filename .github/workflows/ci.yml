name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Create RLS runtime role
        env:
          PGPASSWORD: nexus
        run: >-
          psql -h 127.0.0.1 -U nexus -d nexus_test -v ON_ERROR_STOP=1
          -c "CREATE ROLE nexus_runtime LOGIN PASSWORD 'nexus_runtime';"
      - run: uv run ruff check .
      - run: uv run mypy app tests integrations
      - run: uv run pytest
